<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rock Paper Scissors</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

    <main class="game-container">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="game-header">

            <p class="game-label">
                CLASSIC GAME
            </p>

            <h1>
                Rock Paper Scissors
            </h1>

            <p class="subtitle">
                Choose your weapon
            </p>

        </header>


        <!-- =========================
             GAME AREA
        ========================== -->

        <section class="battle-area">


            <!-- COMPUTER -->

            <div class="player-area">

                <h2>
                    COMPUTER
                </h2>

                <div class="hand-container">

                    <span
                        id="computer-hand"
                        class="hand-icon"
                    >✊</span>

                </div>

                <p
                    id="computer-choice"
                    class="choice-label"
                >
                    Waiting...
                </p>

            </div>


            <!-- VS -->

            <div class="vs">

                <span>VS</span>

            </div>


            <!-- PLAYER -->

            <div class="player-area">

                <h2>
                    YOU
                </h2>

                <div class="hand-container">

                    <span
                        id="player-hand"
                        class="hand-icon"
                    >✊</span>

                </div>

                <p
                    id="player-choice"
                    class="choice-label"
                >
                    Waiting...
                </p>

            </div>


        </section>


        <!-- =========================
             RESULT
        ========================== -->

        <section class="result-area">

            <p class="result-title">
                ROUND RESULT
            </p>

            <h2 id="result">
                Make your move!
            </h2>

        </section>


        <!-- =========================
             PLAYER CHOICES
        ========================== -->

        <section class="choices-section">

            <p class="section-title">
                SELECT YOUR MOVE
            </p>


            <div class="choices">


                <button
                    class="choice-btn"
                    data-choice="rock"
                >

                    <span class="choice-icon">✊</span>

                    <span>
                        Rock
                    </span>

                </button>


                <button
                    class="choice-btn"
                    data-choice="paper"
                >

                    <span class="choice-icon">✋</span>

                    <span>
                        Paper
                    </span>

                </button>


                <button
                    class="choice-btn"
                    data-choice="scissors"
                >

                    <span class="choice-icon">✌️</span>

                    <span>
                        Scissors
                    </span>

                </button>


            </div>

        </section>


        <!-- =========================
             SCOREBOARD
        ========================== -->

        <section class="scoreboard">


            <div class="score-card">

                <span>
                    YOU
                </span>

                <strong id="player-score">
                    0
                </strong>

            </div>


            <div class="score-card">

                <span>
                    DRAWS
                </span>

                <strong id="draw-score">
                    0
                </strong>

            </div>


            <div class="score-card">

                <span>
                    CPU
                </span>

                <strong id="computer-score">
                    0
                </strong>

            </div>


        </section>


        <!-- =========================
             RESET
        ========================== -->

        <button
            id="reset-btn"
            class="reset-btn"
        >
            ↻ Reset Game
        </button>


    </main>


    <!-- JAVASCRIPT -->

    <script src="js/game.js"></script>

    <script src="js/ui.js"></script>

</body>

</html>
